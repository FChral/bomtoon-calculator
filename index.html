<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomtoon TW 優儲計算機</title>
    <!-- 引入 React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .transition-all-custom { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .animate-bounce-subtle {
            animation: bounce-subtle 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        const Icon = ({ name, size = 16, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const App = () => {
            const [exchangeRate] = useState(4.29);
            const [currency, setCurrency] = useState('HKD');
            const [inputValue, setInputValue] = useState('');
            const [targetC, setTargetC] = useState('');
            const [selectedSolutionIdx, setSelectedSolutionIdx] = useState(null);
            
            // 活動類型切換：'normal' (489+786) 或 'special' (666)
            const [promoType, setPromoType] = useState('normal');

            // 5周年限定方案開關與展開面板
            const [isAnniversary, setIsAnniversary] = useState(false);
            const [showAnniversaryPanel, setShowAnniversaryPanel] = useState(false);

            const getTaiwanTime = () => {
                const now = new Date();
                const tzString = now.toLocaleString('en-US', { timeZone: 'Asia/Taipei' });
                return new Date(tzString);
            };

            const [currentTime, setCurrentTime] = useState(getTaiwanTime());
            const [activeTask, setActiveTask] = useState(null);

            // 優儲生效日期設定
            const promotionDates = ["2026-04-02", "2026-06-02", "2026-07-01", "2026-09-03", "2026-10-01"]; 

            const isPromotionDay = useMemo(() => {
                const y = currentTime.getFullYear();
                const m = String(currentTime.getMonth() + 1).padStart(2, '0');
                const d = String(currentTime.getDate()).padStart(2, '0');
                const todayStr = `${y}-${m}-${d}`;
                return promotionDates.includes(todayStr);
            }, [currentTime]);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(getTaiwanTime()), 1000);
                return () => clearInterval(timer);
            }, []);

            // 重置子方案選擇
            useEffect(() => {
                setSelectedSolutionIdx(null);
            }, [inputValue, targetC, promoType, isAnniversary]);

            useEffect(() => {
                setActiveTask(null);
            }, [promoType]);

            // 方案定義
            const allOffers = useMemo(() => ({
                normal: [
                    { id: 'offerA', name: '489 方案', time: '全日限定', startTime: 0, endTime: 24, twd: 489, totalC: 180, baseC: 90, freeC: 90 },
                    { id: 'offerB', name: '786 方案', time: '20:00 - 21:59', startTime: 20, endTime: 22, twd: 786, totalC: 290, baseC: 150, freeC: 140 }
                ],
                special: [
                    { id: 'offerC', name: '666 方案', time: '18:00 - 23:59', startTime: 18, endTime: 24, twd: 666, totalC: 246, baseC: 123, freeC: 123 }
                ]
            }), []);

            const currentOffers = useMemo(() => allOffers[promoType], [promoType, allOffers]);

            const isCurrentlyClickable = (offer) => {
                if (!isPromotionDay) return false;
                
                const isBelongingToActivePromo = currentOffers.some(o => o.id === offer.id);
                if (!isBelongingToActivePromo) return false;

                const hours = currentTime.getHours();
                const minutes = currentTime.getMinutes();
                const timeInDecimal = hours + minutes / 60;
                return timeInDecimal >= offer.startTime && timeInDecimal < offer.endTime;
            };

            const isNotExpiredYet = (offer) => {
                if (!isPromotionDay) return true; 
                const hours = currentTime.getHours();
                const minutes = currentTime.getMinutes();
                return (hours + minutes / 60) < offer.endTime;
            };

            // 每筆購買額外加贈點數（5週年限定模式下每筆489/786加500P，200P=1C）
            const bonusPointsPerPurchase = useMemo(() => {
                return (isAnniversary && promoType === 'normal') ? 500 : 0;
            }, [isAnniversary, promoType]);

            const offerStats = useMemo(() => currentOffers.map(o => {
                const hkdCost = o.twd / exchangeRate;
                const isAvailableNow = isCurrentlyClickable(o);
                const isExpired = isPromotionDay && !isNotExpiredYet(o);

                // 計算包含 5週年 500P (等同 2.5C) 的綜合算力
                const bonusP = bonusPointsPerPurchase;
                const bonusCFromP = bonusP / 200; 
                const totalEffectiveC = o.totalC + bonusCFromP;

                const costPerC = currency === 'HKD' ? (hkdCost / totalEffectiveC) : (o.twd / totalEffectiveC);
                return { ...o, hkdCost, isAvailableNow, isExpired, costPerC, bonusP, bonusCFromP, totalEffectiveC };
            }), [currency, currentTime, exchangeRate, isPromotionDay, currentOffers, bonusPointsPerPurchase]);

            const bestOffer = useMemo(() => {
                return [...offerStats].sort((a, b) => a.costPerC - b.costPerC)[0];
            }, [offerStats]);

            const calculateAllResults = (mode, val) => {
                if (!val || val <= 0) return null;
                const budgetTWD = currency === 'HKD' ? val * exchangeRate : val;

                let bestCombined = null;

                if (promoType === 'normal') {
                    const oA = currentOffers[0]; // 489
                    const oB = currentOffers[1]; // 786

                    // 單次獲得的有效C（包含500P折算之 2.5C）
                    const effCA = oA.totalC + (bonusPointsPerPurchase / 200);
                    const effCB = oB.totalC + (bonusPointsPerPurchase / 200);

                    if (mode === 'budget') {
                        let maxEffC = -1;
                        let maxDirectC = 0;
                        let maxP = 0;
                        let minCost = Infinity;
                        let bestCountA = 0;
                        let bestCountB = 0;

                        const limitA = Math.floor(budgetTWD / oA.twd);
                        for (let a = 0; a <= limitA; a++) {
                            const remainingBudget = budgetTWD - (a * oA.twd);
                            const limitB = Math.floor(remainingBudget / oB.twd);
                            for (let b = 0; b <= limitB; b++) {
                                const cost = a * oA.twd + b * oB.twd;
                                const directPoints = a * oA.totalC + b * oB.totalC;
                                const pointsP = (a + b) * bonusPointsPerPurchase;
                                const totalEffectivePoints = directPoints + (pointsP / 200);

                                if (totalEffectivePoints > maxEffC || (totalEffectivePoints === maxEffC && cost < minCost)) {
                                    maxEffC = totalEffectivePoints;
                                    maxDirectC = directPoints;
                                    maxP = pointsP;
                                    minCost = cost;
                                    bestCountA = a;
                                    bestCountB = b;
                                }
                            }
                        }

                        if (maxEffC > 0) {
                            const items = [];
                            if (bestCountA > 0) items.push({ id: oA.id, name: oA.name, count: bestCountA });
                            if (bestCountB > 0) items.push({ id: oB.id, name: oB.name, count: bestCountB });

                            bestCombined = {
                                title: isAnniversary ? "5週年最佳搭配推薦" : "最佳搭配推薦 (混合方案)",
                                totalC: maxDirectC,
                                totalP: maxP,
                                extraCFromP: maxP / 200,
                                totalEffectiveC: maxEffC,
                                costTWD: minCost,
                                actualCostHKD: minCost / exchangeRate,
                                avgPrice: currency === 'HKD' ? ((minCost / exchangeRate) / maxEffC) : (minCost / maxEffC),
                                itemList: items
                            };
                        }
                    } else {
                        // 目標點數模式
                        let minCost = Infinity;
                        let maxEffC = -1;
                        let maxDirectC = 0;
                        let maxP = 0;
                        let bestCountA = 0;
                        let bestCountB = 0;

                        const limitA = Math.ceil(val / effCA);
                        const limitB = Math.ceil(val / effCB);

                        for (let a = 0; a <= limitA; a++) {
                            for (let b = 0; b <= limitB; b++) {
                                const directPoints = a * oA.totalC + b * oB.totalC;
                                const pointsP = (a + b) * bonusPointsPerPurchase;
                                const totalEffectivePoints = directPoints + (pointsP / 200);

                                if (totalEffectivePoints >= val) {
                                    const cost = a * oA.twd + b * oB.twd;
                                    if (cost < minCost || (cost === minCost && totalEffectivePoints > maxEffC)) {
                                        minCost = cost;
                                        maxEffC = totalEffectivePoints;
                                        maxDirectC = directPoints;
                                        maxP = pointsP;
                                        bestCountA = a;
                                        bestCountB = b;
                                    }
                                }
                            }
                        }

                        if (minCost !== Infinity) {
                            const items = [];
                            if (bestCountA > 0) items.push({ id: oA.id, name: oA.name, count: bestCountA });
                            if (bestCountB > 0) items.push({ id: oB.id, name: oB.name, count: bestCountB });

                            bestCombined = {
                                title: isAnniversary ? "5週年最省搭配推薦" : "最省搭配推薦 (混合方案)",
                                totalC: maxDirectC,
                                totalP: maxP,
                                extraCFromP: maxP / 200,
                                totalEffectiveC: maxEffC,
                                costTWD: minCost,
                                actualCostHKD: minCost / exchangeRate,
                                avgPrice: currency === 'HKD' ? ((minCost / exchangeRate) / maxEffC) : (minCost / maxEffC),
                                itemList: items
                            };
                        }
                    }
                } else {
                    // 666 快閃模式
                    const oC = currentOffers[0];
                    let count = mode === 'budget' ? Math.floor(budgetTWD / oC.twd) : Math.ceil(val / oC.totalC);

                    if (count > 0) {
                        const totalC = count * oC.totalC;
                        const costTWD = count * oC.twd;
                        const actualCostHKD = costTWD / exchangeRate;
                        bestCombined = {
                            title: mode === 'budget' ? "最佳推薦" : "最省推薦",
                            totalC,
                            totalP: 0,
                            extraCFromP: 0,
                            totalEffectiveC: totalC,
                            costTWD,
                            actualCostHKD,
                            avgPrice: currency === 'HKD' ? (actualCostHKD / totalC) : (costTWD / totalC),
                            itemList: [{ id: oC.id, name: oC.name, count }]
                        };
                    }
                }

                // 備用單儲對比方案
                const alternatives = offerStats.map(o => {
                    const effCPerUnit = o.totalC + (o.bonusP / 200);
                    let count = mode === 'budget' ? Math.floor(budgetTWD / o.twd) : Math.ceil(val / effCPerUnit);

                    const totalC = count * o.totalC;
                    const totalP = count * o.bonusP;
                    const extraCFromP = totalP / 200;
                    const totalEffectiveC = totalC + extraCFromP;

                    const costTWD = count * o.twd;
                    const actualCostHKD = costTWD / exchangeRate;
                    const avgPrice = currency === 'HKD' ? (actualCostHKD / (totalEffectiveC || 1)) : (costTWD / (totalEffectiveC || 1));

                    return {
                        id: o.id,
                        title: `單儲 ${o.name}`,
                        name: o.name,
                        count,
                        totalC,
                        totalP,
                        extraCFromP,
                        totalEffectiveC,
                        costTWD,
                        actualCostHKD,
                        avgPrice,
                        itemList: [{ count, name: o.name, id: o.id }]
                    };
                }).filter(res => res.count > 0);

                return { best: bestCombined, alternatives };
            };

            const results = useMemo(() => {
                if (inputValue) return calculateAllResults('budget', parseFloat(inputValue));
                if (targetC) return calculateAllResults('target', parseFloat(targetC));
                return null;
            }, [inputValue, targetC, currency, exchangeRate, offerStats, promoType, isAnniversary]);

            const currentDisplaySolution = useMemo(() => {
                if (!results) return null;
                return selectedSolutionIdx === null ? results.best : results.alternatives[selectedSolutionIdx];
            }, [results, selectedSolutionIdx]);

            const startTask = (res) => {
                if (!isPromotionDay) return;
                const items = res.itemList.map(it => {
                    const o = [...allOffers.normal, ...allOffers.special].find(off => off.id === it.id);
                    return { 
                        ...it, 
                        total: it.count, 
                        remaining: it.count, 
                        perUnitC: o.totalC, 
                        perUnitP: isAnniversary && promoType === 'normal' ? 500 : 0,
                        startTime: o.startTime, 
                        endTime: o.endTime 
                    };
                });
                setActiveTask({ items, totalGoalC: res.totalC, totalGoalP: res.totalP || 0, totalEffectiveC: res.totalEffectiveC });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const trackStep = (id) => {
                setActiveTask(prev => ({
                    ...prev,
                    items: prev.items.map(it => it.id === id && it.remaining > 0 ? { ...it, remaining: it.remaining - 1 } : it)
                }));
            };

            const currentTotalC = useMemo(() => activeTask?.items.reduce((acc, it) => acc + (it.total - it.remaining) * it.perUnitC, 0) || 0, [activeTask]);
            const currentTotalP = useMemo(() => activeTask?.items.reduce((acc, it) => acc + (it.total - it.remaining) * it.perUnitP, 0) || 0, [activeTask]);
            const isAllCompleted = useMemo(() => activeTask?.items.length > 0 && activeTask.items.every(it => it.remaining === 0), [activeTask]);

            const MainResultCard = ({ res }) => {
                if (!res) return null;
                const isAlternative = selectedSolutionIdx !== null;
                const hasP = res.totalP > 0;

                return (
                    <div className="mt-4 p-4 bg-pink-50/50 rounded-2xl border border-pink-200 shadow-sm transition-all-custom">
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <p className="text-[10px] font-bold text-pink-500 uppercase tracking-widest flex items-center gap-1">
                                    <Icon name={isAlternative ? "layers" : "sparkles"} size={10} />
                                    {res.title}
                                </p>
                                <div className="flex items-baseline gap-1.5 flex-wrap">
                                    <span className="text-3xl font-black text-pink-600">{res.totalC}</span>
                                    <span className="text-xs font-bold text-pink-400 uppercase tracking-tighter">C</span>
                                    {hasP && (
                                        <span className="text-xs font-black text-purple-600 bg-purple-100 px-2 py-0.5 rounded-full border border-purple-200">
                                            + {res.totalP} P
                                        </span>
                                    )}
                                </div>
                                {hasP && (
                                    <p className="text-[10px] font-bold text-purple-600 mt-1">
                                        💡 積分折算：{res.totalP}P = {res.extraCFromP}C (總等值 <span className="font-black text-pink-600">{res.totalEffectiveC} C</span>)
                                    </p>
                                )}
                                <div className="mt-1 flex flex-col gap-1">
                                    <div className="px-2 py-0.5 bg-pink-100/50 border border-pink-200 rounded text-[10px] font-bold text-pink-500 inline-block">
                                        均價：{currency} {res.avgPrice ? res.avgPrice.toFixed(3) : "0.000"}/{hasP ? '等值C' : 'C'}
                                    </div>
                                </div>
                            </div>
                            <div className="text-right">
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">實際支出</p>
                                <p className="text-xl font-black text-slate-700">
                                    {currency === 'HKD' ? `$${(res.actualCostHKD || 0).toFixed(2)}` : `${res.costTWD || 0} TWD`}
                                </p>
                            </div>
                        </div>

                        <div className="space-y-2 mb-4">
                            {res.itemList.map((it, i) => (
                                <div key={i} className="flex justify-between items-center bg-white/80 px-3 py-2 rounded-xl text-sm font-bold border border-white shadow-sm">
                                    <div className="flex items-center gap-1.5">
                                        <span className="text-slate-600">{it.name}</span>
                                        {isAnniversary && promoType === 'normal' && (
                                            <span className="text-[9px] font-black text-purple-600 bg-purple-50 px-1.5 py-0.5 rounded border border-purple-200">+500P</span>
                                        )}
                                    </div>
                                    <span className="text-pink-500 bg-pink-50 px-2 py-0.5 rounded-lg">x {it.count} 次</span>
                                </div>
                            ))}
                        </div>

                        {!isPromotionDay ? (
                            <div className="space-y-2">
                                <button disabled className="w-full bg-slate-200 text-slate-400 font-black py-4 rounded-2xl flex justify-center items-center gap-3 text-sm cursor-not-allowed">
                                    <Icon name="lock" size={20} /> 目前非優儲活動日
                                </button>
                                <p className="text-[10px] text-center text-orange-500 font-bold px-4 leading-relaxed">
                                    請密切留意 BomtoonTW 官網公告下一次優儲日期方可解鎖執行功能。
                                </p>
                            </div>
                        ) : (
                            <button onClick={() => startTask(res)} className="w-full bg-pink-500 hover:bg-pink-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-pink-500/20 flex justify-center items-center gap-3 text-sm active:scale-95 transition-all">
                                <Icon name="play-circle" size={20} /> 開始執行此方案
                            </button>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen p-4 pb-24 mx-auto max-w-md">
                    {/* Header */}
                    <div className="mb-6 flex justify-between items-center">
                        <div>
                            <h1 className="text-2xl font-bold text-pink-600 tracking-tight">Bomtoon TW 優儲計算機</h1>
                            <div className="flex items-center gap-2 text-[10px] text-slate-500 font-bold mt-1">
                                <span className="bg-pink-100 text-pink-600 px-1.5 py-0.5 rounded">TAIWAN TIME</span>
                                {currentTime.toLocaleTimeString('en-GB')}
                            </div>
                        </div>
                        <div className="flex bg-white p-1 rounded-xl shadow-sm border border-slate-200">
                            {['HKD', 'TWD'].map(c => (
                                <button key={c} onClick={() => setCurrency(c)} className={`px-4 py-1.5 text-xs font-black rounded-lg transition-all ${currency === c ? 'bg-pink-500 text-white shadow-md' : 'text-slate-400'}`}>{c}</button>
                            ))}
                        </div>
                    </div>

                    {/* 活動類型選單標籤 */}
                    <div className="mb-3 bg-slate-100 p-1 rounded-2xl flex border border-slate-200/50">
                        <button 
                            onClick={() => setPromoType('normal')} 
                            className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 ${promoType === 'normal' ? 'bg-white text-pink-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                        >
                            <Icon name="calendar-days" size={14} /> 普通優儲
                        </button>
                        <button 
                            onClick={() => setPromoType('special')} 
                            className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 ${promoType === 'special' ? 'bg-white text-pink-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                        >
                            <Icon name="sparkles" size={14} /> 666 限時快閃
                        </button>
                    </div>

                    {/* 可折疊之「5週年限定」儲值方案模組 */}
                    {promoType === 'normal' && (
                        <div className="mb-4 bg-gradient-to-r from-purple-500/10 via-pink-500/10 to-amber-500/10 rounded-2xl border border-purple-200/60 p-3 transition-all">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                    <span className="p-1.5 bg-purple-600 text-white rounded-lg font-black text-xs">
                                        <Icon name="gift" size={14} />
                                    </span>
                                    <div>
                                        <div className="text-xs font-black text-purple-900 flex items-center gap-1">
                                            5 週年限定加碼
                                            <span className="text-[9px] bg-purple-200 text-purple-800 px-1.5 py-0.2 rounded-full font-bold">+500P/次</span>
                                        </div>
                                        <div className="text-[10px] text-purple-600 font-bold">每 200P 積分 = 1C (自動併入總C數)</div>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button 
                                        onClick={() => setIsAnniversary(!isAnniversary)} 
                                        className={`relative w-12 h-6 rounded-full transition-colors p-0.5 ${isAnniversary ? 'bg-purple-600' : 'bg-slate-300'}`}
                                    >
                                        <div className={`w-5 h-5 bg-white rounded-full shadow-md transform transition-transform ${isAnniversary ? 'translate-x-6' : 'translate-x-0'}`} />
                                    </button>
                                    <button 
                                        onClick={() => setShowAnniversaryPanel(!showAnniversaryPanel)} 
                                        className="text-purple-400 hover:text-purple-700 transition-colors p-1"
                                        title="規則說明"
                                    >
                                        <Icon name={showAnniversaryPanel ? "chevron-up" : "chevron-down"} size={16} />
                                    </button>
                                </div>
                            </div>

                            {/* 可展開的詳細說明 */}
                            {showAnniversaryPanel && (
                                <div className="mt-3 pt-3 border-t border-purple-200/40 text-[10px] text-purple-800 space-y-1 animate-in fade-in duration-200">
                                    <p className="font-bold flex items-center gap-1">✨ 5週年加碼優惠：</p>
                                    <p>・開啟後，每一次儲值 489 或 786 方案皆加贈 <b>500P 積分</b>。</p>
                                    <p>・系統會按官方匯率 <b>200P = 1C</b>（即每次加贈 2.5C）自動計算最省錢且最多 C+P 的最佳混搭。</p>
                                </div>
                            )}
                        </div>
                    )}

                    {/* 任務追蹤面板 */}
                    {activeTask && (
                        <div className="mb-6 bg-slate-900 text-white p-5 rounded-3xl shadow-2xl border border-slate-700 animate-in zoom-in-95 duration-300">
                            <div className="flex justify-between mb-4">
                                <h2 className="font-bold flex items-center gap-2 text-pink-400"><Icon name="zap" size={18} /> 儲值任務執行中</h2>
                                <button onClick={() => setActiveTask(null)} className="text-slate-500 hover:text-white transition-colors"><Icon name="x-circle" size={20} /></button>
                            </div>
                            <div className="mb-5 bg-slate-800/50 p-4 rounded-2xl text-center border border-slate-700/30">
                                <div className="text-[10px] text-slate-400 uppercase tracking-widest mb-1">優儲進度：{currentTotalC} / {activeTask.totalGoalC} C</div>
                                <div className="text-3xl font-black tabular-nums">
                                    {currentTotalC} <span className="text-slate-500 text-xs">C</span>
                                    {activeTask.totalGoalP > 0 && (
                                        <span className="text-purple-400 text-sm font-bold ml-2">+ {currentTotalP} P</span>
                                    )}
                                </div>
                                <div className="mt-3 h-2.5 bg-slate-800 rounded-full overflow-hidden">
                                    <div className="h-full bg-gradient-to-r from-pink-600 to-purple-500 transition-all duration-1000 shadow-[0_0_10px_rgba(219,39,119,0.5)]" style={{ width: `${(currentTotalC/activeTask.totalGoalC)*100}%` }} />
                                </div>
                            </div>
                            <div className="space-y-3">
                                {activeTask.items.map(it => {
                                    const can = isCurrentlyClickable(it);
                                    return (
                                        <div key={it.id} className={`p-4 rounded-2xl border transition-all ${it.remaining === 0 ? 'bg-green-500/10 border-green-500/30 opacity-60' : (can ? 'bg-slate-800 border-slate-700 shadow-md' : 'bg-slate-900 border-slate-800 opacity-50')}`}>
                                            <div className="flex justify-between items-center">
                                                <div className="flex-1 text-left">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className={`text-[9px] font-black px-2 py-0.5 rounded-full ${it.remaining === 0 ? 'bg-green-500 text-white' : (can ? 'bg-pink-500 text-white' : 'bg-slate-700')}`}>{it.remaining === 0 ? '已清' : (can ? '可點擊' : '未到時間')}</span>
                                                        <span className="text-xs text-slate-300 font-bold">{it.name}</span>
                                                    </div>
                                                    <div className="text-lg font-black italic">剩餘 {it.remaining} 次</div>
                                                </div>
                                                <button onClick={() => trackStep(it.id)} disabled={it.remaining === 0 || !can} className={`w-12 h-12 flex items-center justify-center rounded-2xl transition-all ${it.remaining > 0 && can ? 'bg-pink-500 hover:bg-pink-400 active:scale-90 shadow-lg shadow-pink-500/30' : 'bg-slate-700 text-slate-500 cursor-not-allowed'}`}>
                                                    {it.remaining === 0 ? <Icon name="check" size={24} className="text-green-400" /> : <Icon name={can ? "mouse-pointer-2" : "lock"} size={22} />}
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}

                                {isAllCompleted && (
                                    <div className="mt-4 p-4 bg-green-500 text-white rounded-2xl text-center font-black flex justify-center items-center gap-2 animate-bounce-subtle shadow-lg shadow-green-500/20">
                                        <Icon name="award" size={20} />
                                        <span>儲夠啦！恭喜你有C可用啦！</span>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 方案卡片網格 */}
                    <div className="mb-6 grid grid-cols-2 gap-3">
                        {offerStats.map(o => {
                            const isBest = bestOffer?.id === o.id;
                            const isLocked = !isPromotionDay;
                            const isSingleOffer = currentOffers.length === 1;

                            return (
                                <div 
                                    key={o.id} 
                                    className={`relative p-3 rounded-2xl bg-white border-2 transition-all duration-300 ${
                                        o.isExpired ? 'opacity-40 grayscale border-transparent' : 'border-transparent shadow-sm hover:shadow-md'
                                    } ${isSingleOffer ? 'col-span-2' : ''}`}
                                >
                                    {isBest && !o.isExpired && (
                                        <div className="absolute top-2 right-2 text-[8px] font-black text-pink-500 bg-pink-50 px-1.5 py-0.5 rounded-md uppercase tracking-tighter">最優惠</div>
                                    )}
                                    <div className="flex justify-center gap-1 text-[9px] font-bold uppercase mb-1">
                                        <Icon name={o.isAvailableNow ? "clock" : "lock"} size={10} className={o.isAvailableNow ? "text-pink-500" : "text-slate-400"} />
                                        {o.time}
                                    </div>
                                    <div className="text-xs font-bold text-slate-500 flex items-center justify-center gap-1">
                                        {o.name}
                                        {o.bonusP > 0 && <span className="text-[9px] bg-purple-100 text-purple-700 px-1 rounded font-black">+500P</span>}
                                    </div>
                                    <div className="flex items-baseline justify-center gap-1 my-1">
                                        <div className="text-2xl font-black leading-none">{o.totalC} <span className="text-[10px] font-normal text-slate-400 tracking-tighter">C</span></div>
                                        <div className="text-[8px] text-pink-400 font-bold leading-none truncate">(含 {o.freeC} 免費)</div>
                                    </div>
                                    {o.bonusP > 0 && (
                                        <div className="text-[9px] text-purple-600 font-bold text-center mb-1">
                                            + {o.bonusP}P 積分 (= {o.bonusCFromP}C)
                                        </div>
                                    )}
                                    <div className={`text-[10px] font-black py-1.5 rounded-lg text-center flex flex-col items-center justify-center gap-0.5 ${o.isAvailableNow ? 'bg-pink-50 text-pink-600' : 'bg-slate-100 text-slate-400'}`}>
                                        <span>{isLocked ? '等待公告日期' : (o.isExpired ? '今日已完' : (o.isAvailableNow ? '已開賣' : '待解鎖'))}</span>
                                        <span className="text-[8px] opacity-70">{currency}: {o.costPerC.toFixed(3)}/{o.bonusP > 0 ? '等值C' : 'C'}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* 輸入與計算結果比較區 */}
                    <div className="space-y-4">
                        <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                            <div className="flex items-center gap-2 mb-4 text-pink-600 font-black text-sm uppercase tracking-widest"><Icon name="wallet" size={16} /> 預算/目標</div>
                            <div className="relative mb-4">
                                <input type="number" placeholder={`輸入預算 ${currency}`} value={inputValue} onChange={e => {setInputValue(e.target.value); setTargetC('');}} className="w-full bg-slate-50 p-4 pr-12 rounded-2xl text-xl font-black outline-none focus:ring-2 ring-pink-100 transition-all placeholder:text-slate-300" />
                                <span className="absolute right-5 top-1/2 -translate-y-1/2 text-slate-300 font-black text-sm tracking-widest">{currency}</span>
                            </div>
                            <div className="relative">
                                <input type="number" placeholder="或是目標點數 (C)" value={targetC} onChange={e => {setTargetC(e.target.value); setInputValue('');}} className="w-full bg-slate-50 p-4 pr-12 rounded-2xl text-xl font-black outline-none focus:ring-2 ring-slate-200 transition-all placeholder:text-slate-300" />
                                <span className="absolute right-5 top-1/2 -translate-y-1/2 text-slate-300 font-black text-sm tracking-widest">C</span>
                            </div>

                            {results && (
                                <div className="mt-4 animate-in fade-in slide-in-from-top-2 duration-500">
                                    <MainResultCard res={currentDisplaySolution} />
                                    {results.alternatives.length > 1 && (
                                        <div className="mt-4">
                                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 ml-1">點擊下方卡片切換比較與差價</p>
                                            <div className="grid grid-cols-2 gap-3">
                                                {selectedSolutionIdx !== null && (
                                                    <div onClick={() => setSelectedSolutionIdx(null)} className="p-3 bg-white rounded-2xl border-2 border-pink-200 shadow-sm cursor-pointer text-center hover:border-pink-300 transition-all">
                                                        <p className="text-[9px] font-bold text-pink-500 uppercase mb-1">← 返回最佳推薦</p>
                                                        <p className="text-lg font-black text-pink-600 leading-tight">{results.best.totalEffectiveC} C</p>
                                                        <p className="text-[9px] font-bold text-pink-400 mt-1">均價: {currency} {results.best.avgPrice.toFixed(3)}</p>
                                                    </div>
                                                )}
                                                {results.alternatives.map((alt, idx) => {
                                                    if (selectedSolutionIdx === idx) return null;
                                                    
                                                    const diffC = results.best.totalEffectiveC - alt.totalEffectiveC;
                                                    const diffCostTWD = alt.costTWD - results.best.costTWD;
                                                    const diffCostHKD = alt.actualCostHKD - results.best.actualCostHKD;
                                                    const diffCostDisplay = currency === 'HKD' ? `$${diffCostHKD.toFixed(1)}` : `${diffCostTWD.toFixed(0)} TWD`;

                                                    return (
                                                        <div key={idx} onClick={() => setSelectedSolutionIdx(idx)} className="p-3 bg-slate-50 hover:bg-slate-100 rounded-2xl border border-slate-200 cursor-pointer text-center transition-all duration-200">
                                                            <p className="text-[9px] font-bold text-slate-400 uppercase mb-1">單儲 {alt.name}</p>
                                                            <p className="text-lg font-black text-slate-600 leading-tight">{alt.totalEffectiveC} C</p>
                                                            {alt.totalP > 0 && (
                                                                <p className="text-[8px] font-bold text-purple-600">(含 {alt.totalP}P)</p>
                                                            )}
                                                            <p className="text-[9px] font-bold text-slate-500 mt-1">均價: {currency} {alt.avgPrice.toFixed(3)}</p>
                                                            {inputValue && diffC > 0 && (
                                                                <p className="text-[8px] text-red-400 font-bold mt-1 leading-none">(少 {diffC} C)</p>
                                                            )}
                                                            {targetC && diffCostTWD > 0 && (
                                                                <p className="text-[8px] text-red-400 font-bold mt-1 leading-none">(貴 {diffCostDisplay})</p>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                    
                    <div className="mt-8 px-4 text-center">
                        <p className="text-[10px] text-slate-400 font-bold leading-relaxed tracking-tight">
                            💡 提示：非優儲活動日時，系統僅提供計算功能。<br/>
                            混合搭配推薦會自動算出最佳化的 CP 值儲值路徑。
                        </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
